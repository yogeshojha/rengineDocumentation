{% set m = page.meta %}
<footer class="rn-meta" aria-label="Page facts">
  <dl>
    <div><dt>Applies to</dt><dd>reNgine {{ config.extra.rengine_version }}</dd></div>
    {% if m.generated %}<div><dt>Generated by</dt><dd><code>{{ m.generated }}</code></dd></div>{% endif %}
    {% if m.source_links %}
      <div><dt>Sources</dt><dd>
        {% for s in m.source_links %}<a href="{{ s.href }}"><code>{{ s.path }}</code></a>{% endfor %}
      </dd></div>
    {% endif %}
    {% if m.revised %}<div><dt>Revised</dt><dd>{{ m.revised }}</dd></div>{% endif %}
  </dl>
</footer>
