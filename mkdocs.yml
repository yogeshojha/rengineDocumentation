site_name: reNgine Documentation
site_url: https://rengine.wiki/
site_author: Yogesh Ojha
site_description: >-
  Documentation for reNgine 3.0, a self-hosted attack surface management platform:
  install and operate an instance, query the attack surface, and use the HTTP API
  and the MCP server.
copyright: Copyright &copy; 2026 Yogesh Ojha. reNgine is released under the GPL-3.0 license.

repo_url: https://github.com/yogeshojha/rengine
repo_name: yogeshojha/rengine
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/images/favicon.svg
  font:
    text: DM Sans
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow the system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

extra:
  rengine_version: 3.0.0
  source_base: https://github.com/yogeshojha/rengine/blob/master/
  docs_source_base: https://github.com/yogeshojha/rengineDocumentation/blob/master/
  generator: false
  redirects:
    import/targets/: pentesters/targets/#target-types
    import/json/: pentesters/targets/#import-formats
    import/csv/: pentesters/targets/#import-formats
    getting-started/: pentesters/install/
    install/quick/: pentesters/install/
    install/detailed/: pentesters/install/
    install/vps/: pentesters/install/
    install/remotedb/: pentesters/install/
    usage/: pentesters/run-a-scan/
    usage/scan_engine/: pentesters/scan-engines/
    changelog/: reference/release-notes/
    api/: developers/api/
    backup/: pentesters/backup/
    update/: pentesters/update/
    uninstall/: pentesters/uninstall/
    security/: developers/security-reporting/
    community/discord/: ""
    community/blog-videos/: ""
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yogeshojha/rengine
    - icon: fontawesome/brands/discord
      link: https://discord.gg/H6WzebwX3H

extra_css:
  - assets/stylesheets/rengine.css

extra_javascript:
  - assets/javascripts/rengine.js

watch:
  - overrides
  - hooks
  - data

hooks:
  - hooks/rengine.py

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

not_in_nav: |
  /index.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.blocks.tab:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: false
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.escapeall:
      hardbreak: false
      nbsp: false

